# Serves the SPA and reverse-proxies /api to the backend (same origin: no CORS, token stays off URLs).
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;
  # The SPA needs no third-party origins, eval, or inline script.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

  location = /healthz { access_log off; add_header Content-Type text/plain; return 200 "ok"; }

  location /api/ {
    proxy_pass http://backend:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;   # overwrite, never append client-supplied values
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 26m;       # matches HUNTERINTEL_MAX_UPLOAD_BYTES (25 MiB) + headroom
    proxy_request_buffering off;    # stream uploads to the hashing endpoint; nothing is spooled to disk
    proxy_read_timeout 120s;        # crt.sh can be slow
  }

  location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; try_files $uri =404; }
  location / { try_files $uri /index.html; add_header Cache-Control "no-store"; }
}
